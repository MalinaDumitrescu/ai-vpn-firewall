seed: 42

data:
  dataset: "vnat"
  features_filename: "features.parquet"
  label_col: "label"
  split_col: "split"

training:
  split_names:
    train: "train"
    val: "val"
    test: "test"
  use_scale_pos_weight: true
  early_stopping_rounds: 200
  num_boost_round: 4000
  verbose_eval: 100
  policy_fprs: [0.001, 0.01, 0.05]
  firewall_policy: 0.001

catboost_params:
  loss_function: "Logloss"
  eval_metric: "AUC"
  depth: 3 # Reduced from 4
  learning_rate: 0.03 # Reduced from 0.05
  subsample: 0.7 # Reduced from 0.8
  colsample_bylevel: 0.7 # Reduced from 0.8
  min_data_in_leaf: 20 # Increased from 5
  l2_leaf_reg: 5.0 # Increased from 2.0 (reg_lambda)
  random_strength: 1.0 # Added
  iterations: 4000
  early_stopping_rounds: 200
  verbose: 100
  allow_writing_files: False

outputs:
  model_path: "artifacts/catboost/model.cbm"
  metrics_path: "artifacts/catboost/metrics.json"
  preds_path: "artifacts/catboost/preds.parquet"
