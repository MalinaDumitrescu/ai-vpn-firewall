seed: 42

data:
  dataset: "vnat"
  features_filename: "features.parquet"  # under data/processed/vnat/
  label_col: "label"
  split_col: "split"

training:
  split_names:
    train: "train"
    val: "val"
    test: "test"
  use_scale_pos_weight: true
  early_stopping_rounds: 200
  num_boost_round: 4000
  verbose_eval: 100
  # NEW: firewall policy targets on validation - added for the cross split on vant and iscx
  policy_fprs: [0.001, 0.01, 0.05]
  firewall_policy: 0.001


xgb_params:
  objective: "binary:logistic"
  eval_metric: ["logloss", "auc", "aucpr"]
  tree_method: "hist"
  max_depth: 3  # Reduced from 4
  learning_rate: 0.03 # Reduced from 0.05
  subsample: 0.7 # Reduced from 0.8
  colsample_bytree: 0.7 # Reduced from 0.8
  min_child_weight: 10 # Increased from 5
  reg_lambda: 5.0 # Increased from 2.0
  reg_alpha: 1.0 # Increased from 0.0
  gamma: 1.0 # Increased from 0.0

outputs:
  model_path: "artifacts/xgb/model.json"
  metrics_path: "artifacts/xgb/metrics.json"
  preds_path: "artifacts/xgb/preds.parquet"
